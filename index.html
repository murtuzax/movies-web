<!DOCTYPE html>

<head>

<body>
    <header>
        <div class="left">
            <img class="logo" src="https://marvel.com/assets/svg/marvel-logo.svg" alt="Logo">
            </div>
        <div class="middle">
            <div>
                Home
            </div>
            <div>
                Genre
            </div>
            <div>
                Category
            </div>
            <div>
                Collection
            </div>
            <div>
                Ott
            </div>
        </div>
        <div class="right">
            <div class="icon-div">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"

                    <path d="m21 21-4.34-4.34" />
                    <circle cx="11" cy="11" r="8" />

            </div>

                <p class="description">The story of J. Robert Oppenheimer’s role in the development of the <br> atomic bomb during World War II.</p>
                <button class="button"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play preview-icon"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg> Watch</button>
